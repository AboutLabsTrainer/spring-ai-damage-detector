spring:
  main:
    banner-mode: off
    web-application-type: none

logging:
  level:
    root: warn
  threshold:
    # --debug sets the property debug to an empty value, which logback reads as DEBUG; without it the console stays off.
    console: ${debug:off}

detector:
  pass-threshold: 0.86
  jev:
    base-url: https://openrouter.ai
    model: typesafe/jev-1.13
    api-key: ${OPENROUTER_API_KEY:}
    connect-timeout: 10s
    read-timeout: 30s
